services:
  silentsos-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silentsos-standalone
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      # Mount persistent evidence media directory outside container
      - ./backend/evidence:/app/backend/evidence
    environment:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional local PostgreSQL service for 100% self-hosted offline deployments.
